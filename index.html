<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Abiha ke liye</title>
<style>
/* Custom font: fonts/ folder mein rakho, phir yeh kholo aur --serif mein naam sabse pehle likho:
@font-face{font-family:"MyFont";src:url("fonts/MyFont.woff2") format("woff2");font-display:swap} */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;--ms:clamp(84px,20vw,110px);--lit:.25;--mt:calc(30px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:linear-gradient(180deg,#05071d,#0c1233 55%,#16204a);color:#e8ebf8;font-family:var(--serif);user-select:none;touch-action:manipulation;overscroll-behavior:none}
.au,#cv,.halo,#moon{position:fixed;pointer-events:none}
.au{border-radius:50%;filter:blur(70px);opacity:.35;animation:dr 24s ease-in-out infinite alternate}
.a1{width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:#5b4bd6}
.a2{width:60vmax;height:60vmax;right:-20vmax;top:25vh;background:#127c86;animation-duration:30s}
.a3{width:50vmax;height:50vmax;left:10vw;bottom:-25vmax;background:#a23d8f;opacity:.2;animation-duration:36s}
.a4{width:60vmax;height:60vmax;left:20vw;top:10vh;background:#ff9a4d;opacity:0;transition:opacity 3s}
body.warm .a4{opacity:.4}
@keyframes dr{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#cv{inset:0;width:100%;height:100%}
.halo{left:50%;top:calc(var(--mt) + var(--ms)/2);width:min(130vw,560px);aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(176,170,255,.38),transparent 65%);opacity:var(--lit);transition:opacity 2.6s}
.halo.w2{background:radial-gradient(circle,rgba(255,196,120,.55),transparent 65%);opacity:0}
body.warm .halo.w2{opacity:var(--lit)}
#moon{left:50%;top:var(--mt);width:var(--ms);height:var(--ms);transform:translateX(-50%);animation:br 5s ease-in-out infinite;filter:drop-shadow(0 0 22px rgba(205,208,255,.55))}
@keyframes br{50%{filter:drop-shadow(0 0 38px rgba(205,208,255,.85))}}
#sh{transition:transform 2.8s cubic-bezier(.4,0,.2,1)}
.s1{stop-color:#fbf8ff;transition:stop-color 2.2s}.s2{stop-color:#c4cdee;transition:stop-color 2.2s}
body.warm .s1{stop-color:#fff0c8}body.warm .s2{stop-color:#f1b878}
#stage{position:fixed;inset:0;z-index:3}
.pg{position:absolute;inset:0;display:flex;justify-content:center;overflow:hidden}
.in{width:100%;max-width:34rem;padding:calc(var(--mt) + var(--ms) + 16px) 1.5rem calc(2.6rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.9rem}
.rv{opacity:0;transform:translateY(16px);filter:blur(6px);transition:opacity 1s,transform 1s,filter 1s}
.rv.show{opacity:1;transform:none;filter:none}
.w{display:inline-block;white-space:pre;opacity:0;transform:translateY(8px);filter:blur(5px);transition:opacity .9s,transform .9s,filter .9s;transition-delay:calc(var(--i)*60ms)}
.show .w{opacity:1;transform:none;filter:none}
.tt{font-weight:400;font-size:clamp(2rem,8.5vw,2.8rem);line-height:1.12;color:#e6e2ff;text-shadow:0 0 28px rgba(176,170,255,.6);animation:gl 4s ease-in-out infinite alternate}
@keyframes gl{to{text-shadow:0 0 46px rgba(127,227,208,.75)}}
.tx{font-size:clamp(1rem,3.9vw,1.18rem);line-height:1.7;max-width:28rem;color:rgba(232,235,248,.92)}
.hint{font-size:.9rem;color:rgba(232,235,248,.55)}
.cap{min-height:3rem;font-size:1.1rem;line-height:1.6;color:#ffd9a8;max-width:26rem}
.cap.f{animation:up .9s both}
@keyframes up{from{opacity:0;transform:translateY(8px);filter:blur(5px)}}
button{font:inherit;font-size:1rem;color:#e8ebf8;cursor:pointer;padding:.8rem 1.3rem;border-radius:999px;border:1px solid rgba(207,201,255,.7);background:rgba(10,14,40,.5);touch-action:manipulation}
button:focus-visible{outline:3px solid #ffcf99;outline-offset:3px}
button.fill{background:#d6d1ff;color:#0c1233;border-color:#d6d1ff}
.nx{opacity:0;transform:scale(.6);pointer-events:none;transition:opacity .6s,transform .7s cubic-bezier(.3,1.6,.5,1)}
.nx.show{opacity:1;transform:none;pointer-events:auto;animation:pl 2s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(214,209,255,.5)}50%{box-shadow:0 0 0 12px rgba(214,209,255,0)}}
.ringb{width:150px;height:150px;border:0;background:none;padding:0;border-radius:50%;touch-action:none}
.ringb svg{width:100%;height:100%}
.ringb circle{fill:none;stroke-width:2.5}
.trk{stroke:rgba(127,227,208,.25)}
#arc{stroke:#7fe3d0;stroke-linecap:round;stroke-dasharray:289;stroke-dashoffset:289;transform:rotate(-90deg);transform-origin:50% 50%;filter:drop-shadow(0 0 6px #7fe3d0)}
.core{fill:rgba(127,227,208,.4)!important;stroke:none;animation:pu 2.4s ease-in-out infinite;transform-origin:50% 50%}
@keyframes pu{50%{transform:scale(1.3);opacity:.5}}
.area{position:relative;width:100%;max-width:26rem;height:34vh;min-height:180px}
.stp{position:absolute;width:48px;height:48px;margin:-24px;padding:0;border:0;background:none;border-radius:50%}
.stp::before{content:"";position:absolute;inset:10px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);opacity:.6;animation:pu 2s ease-in-out infinite;transition:transform .8s,background .8s}
.stp.lit::before{background:#fff3c8;transform:scale(1.7) rotate(45deg);opacity:1;animation:none;filter:drop-shadow(0 0 8px #ffd9a8)}
.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lines line{stroke:#d6d1ff;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:700;stroke-dashoffset:700;animation:ds 1.2s forwards;filter:drop-shadow(0 0 4px #d6d1ff)}
@keyframes ds{to{stroke-dashoffset:0}}
.hb{position:relative;overflow:hidden;min-width:15rem;padding:1rem 1.4rem;touch-action:none}
.hb .fl{position:absolute;inset:0;background:linear-gradient(90deg,#7fe3d0,#d6d1ff);transform-origin:0 50%;transform:scaleX(0);opacity:.55}
.hb span{position:relative}
.wv svg{width:100%;height:110px}
.wv path{fill:none;stroke:#d6d1ff;stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 6px #b0aaff)}
.wv path.gold{stroke:#ffd9a8;filter:drop-shadow(0 0 10px #ffcf99)}
.wv .lab{display:flex;justify-content:space-between;font-size:.85rem;color:rgba(232,235,248,.6)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(214,209,255,.35)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(214,209,255,.35)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#c4cdee);box-shadow:0 0 18px #b0aaff}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#c4cdee);box-shadow:0 0 18px #b0aaff}
.lrow{display:flex;gap:1.5rem;justify-content:center;margin:.4rem 0}
.lan{width:54px;height:72px;border:0;background:none;padding:0;position:relative;animation:bob 4s ease-in-out infinite}
.lan:nth-child(2){animation-delay:-1.3s}.lan:nth-child(3){animation-delay:-2.6s}
.lan i{position:absolute;inset:0;border-radius:42% 42% 38% 38%/32% 32% 46% 46%;background:radial-gradient(circle at 50% 60%,#ffe9b8,#ff9d5c 70%);box-shadow:0 0 26px rgba(255,170,90,.7)}
.lan.go{animation:rise 2.8s ease-in forwards;pointer-events:none}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes rise{to{transform:translateY(-55vh) scale(.6);opacity:0}}
.pr{margin:.3rem 0;font-size:1rem;line-height:1.5;animation:up .9s both}
.pr b{display:block;font-weight:400;color:#ffd9a8;font-size:1.05rem}
.card{position:relative;width:100%;max-width:28rem;padding:1.2rem;border-radius:20px;text-align:left;cursor:pointer;border:1.5px solid transparent;background:linear-gradient(rgba(12,18,52,.85),rgba(12,18,52,.85)) padding-box,conic-gradient(from var(--a),#d6d1ff,#7fe3d0,#ffcf99,#d6d1ff) border-box;animation:sp 7s linear infinite;box-shadow:0 0 40px rgba(176,170,255,.25)}
@keyframes sp{to{--a:360deg}}
.ghost,.typed{font-size:clamp(.95rem,3.6vw,1.08rem);line-height:1.7;white-space:pre-wrap}
.ghost{visibility:hidden}
.typed{position:absolute;inset:1.2rem;color:#f1ecff}
.typed::after{content:"";display:inline-block;width:2px;height:1.1em;margin-left:2px;vertical-align:-.15em;background:#ffd9a8;animation:bl 1s steps(2) infinite}
.typed.end::after{display:none}
@keyframes bl{50%{opacity:0}}
.choices{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
.reply{min-height:2.6rem;font-size:1.1rem;line-height:1.6;color:#ffd9a8}
.rip{position:fixed;z-index:7;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid #7fe3d0;pointer-events:none;animation:rp 1.2s ease-out forwards}
@keyframes rp{to{transform:scale(12);opacity:0}}
.glowline{position:fixed;left:0;right:0;top:0;height:3px;z-index:6;background:linear-gradient(90deg,transparent,#d6d1ff,transparent);box-shadow:0 0 24px #b0aaff;pointer-events:none}
.ring{position:fixed;z-index:6;border-radius:50%;border:2px solid #7fe3d0;box-shadow:0 0 25px #7fe3d0,inset 0 0 25px #7fe3d0;transform:translate(-50%,-50%);pointer-events:none}
.made{position:fixed;z-index:8;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.72rem;letter-spacing:.04em;color:rgba(232,235,248,.5);pointer-events:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.w{opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<div class="au a1"></div><div class="au a2"></div><div class="au a3"></div><div class="au a4"></div>
<canvas id="cv"></canvas><div class="halo"></div><div class="halo w2"></div>
<svg id="moon" viewBox="0 0 200 200" aria-hidden="true">
  <defs>
    <radialGradient id="g" cx="38%" cy="35%" r="75%"><stop offset="0" class="s1"/><stop offset="1" class="s2"/></radialGradient>
    <mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="#fff"/><circle id="sh" cx="100" cy="100" r="80" fill="#000"/></mask>
  </defs>
  <circle cx="100" cy="100" r="80" fill="#c4cdee" opacity=".07"/>
  <g mask="url(#mk)"><circle cx="100" cy="100" r="80" fill="url(#g)"/>
    <circle cx="72" cy="82" r="11" fill="#8f9bc8" opacity=".2"/><circle cx="124" cy="122" r="15" fill="#8f9bc8" opacity=".18"/>
    <circle cx="98" cy="60" r="6" fill="#8f9bc8" opacity=".2"/><circle cx="132" cy="76" r="8" fill="#8f9bc8" opacity=".16"/><circle cx="76" cy="130" r="7" fill="#8f9bc8" opacity=".16"/></g>
</svg>
<div id="stage"></div>
<p class="made">Made by Zain</p>

<script>
/* ===== YAHAN APNE ALFAAZ LIKHO: sirf yeh hissa edit karna hai =====
   off = chaand ki phase (26 patli hilaal ... 175 poora chaand), lit = chaand ki roshni (0 se 1) */
const P = [
  { t: "gate", off: 26, lit: .25, title: "Abiha ke liye", tx: "Chaand ke neeche, ek chhoti si kahani.", hint: "Chaand ko jagane ke liye ring ko dabao aur pakde rakho" },
  { t: "stars", off: 48, lit: .4, title: "Abiha,", tx: "Yeh kahani tumhare liye hai. Pehle teen taare roshan karo.",
    cap: "Taare door lagte hain, par aasman ek hi hota hai." },
  { t: "calm", off: 70, lit: .55, title: "Do hafte", tx: "Dimaag mein jab bohot shor hota hai, tumse baat karte hi wo shant ho jata hai. Shor ko shant karo.",
    btn: "Dabao aur pakde rakho", doneBtn: "Shant ho gaya" },
  { t: "line", off: 95, lit: .7, title: "Us raat", tx: "Maine baat ghuma di thi, jabke tumne seedha bolne ko kaha tha. Woh meri galti thi. Ghumi hui baat ko seedha karo.",
    cap: "Seedhi baat. Aage se bas yahi." },
  { t: "lanterns", off: 125, lit: .82, title: "Mera waada", tx: "Teen fanoos chhodo. Har ek mein ek waada hai.", items: [
    { label: "Seedha bolunga", text: "Chahe baat mushkil ho, ghuma kar nahi." },
    { label: "Ahmiyat doonga", text: "Tumhari baat meri nazar mein hamesha value rakhti hai." },
    { label: "Chhota nahi karunga", text: "Kisi ke saamne tumhein kabhi chhota nahi hone doonga." } ] },
  /* ✎ Yeh tumhara khaas message hai: typing style mein chalega. Isay apne alfaaz mein badal do. */
  { t: "letter", off: 150, lit: .92, title: "Ek khaas baat",
    message: "Abiha,\ndo hafton mein tumne mere bhaari dil ko halka kiya hai. Yeh maine kabhi kaha nahi, par tumhari baatein mere liye sukoon hain.\nUs raat meri galti thi. Main tumhari baat ko seedha sunta aur seedha jawab deta.\nAb se tumhari har baat poore dhyan se sununga.\nTum naraz raho ya na raho, tum mere liye khaas ho, aur main tumhara dost rahunga.\n- Zain" },
  { t: "end", off: 175, lit: 1, title: "Ab faisla tumhara", tx: "Dekho, chaand poora ho gaya. Jo bhi tum chaho, main uski izzat karunga.",
    yes: "Chalo, phir se baat karte hain", wait: "Mujhe thora waqt chahiye",
    yesReply: "Shukriya, Abiha. Main yahin hoon.", waitReply: "Theek hai. Jab tum ready ho, main wait karunga." }
];
/* ================================================================= */

const $ = id => document.getElementById(id), stage = $("stage");
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TR = ["", "circle", "zoom", "curtain", "circle", "zoom", "curtain"];
let cur = -1, busy = false, hold = false, hp = 0, chaos = 0, warp = 0, task = "", S = {}, last = 0;
const mk = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const words = (e, t) => t.split(" ").forEach((w, i) => { const s = mk("span", "w"); s.style.setProperty("--i", i); s.textContent = w + " "; e.append(s); });

// ---------- canvas: stars (parallax + warp), dust, shooting stars, bursts ----------
const cv = $("cv"), cx = cv.getContext("2d");
let W, H, D, px, py;
function size() { D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * D; cv.height = H * D; cx.setTransform(D, 0, 0, D, 0, 0); }
size(); addEventListener("resize", size); px = W / 2; py = H / 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const stars = [...Array(110)].map(() => ({ x: rnd(0, 1), y: rnd(0, 1), r: rnd(.4, 1.5), p: rnd(0, 6.3), z: rnd(.2, 1) }));
const cols = ["#7fe3d0", "#d6d1ff", "#ffd9a8"];
const dust = [...Array(55)].map(() => ({ x: rnd(0, W), y: rnd(0, H), vx: 0, vy: 0, r: rnd(1, 2.6), p: rnd(0, 6.3), c: cols[Math.floor(rnd(0, 3))] }));
let bursts = [], shoots = [];
function burst(x, y, c, n) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.3), s = rnd(1, 5); bursts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, l: 1, c }); } }
function shootStar() { shoots.push({ x: rnd(W * .4, W), y: rnd(0, H * .35), vx: -rnd(7, 11), vy: rnd(3, 5), l: 1 }); }
setInterval(() => { if (!document.hidden && !RM) shootStar(); }, 5000);
addEventListener("pointermove", e => { px = e.clientX; py = e.clientY; });

function ripple(x, y) { const r = mk("span", "rip"); r.style.left = x + "px"; r.style.top = y + "px"; document.body.append(r); setTimeout(() => r.remove(), 1300); }

// ---------- pages ----------
function build(i) {
  const p = P[i], el = mk("div", "pg"), inn = mk("div", "in"), st = { i }; el.append(inn);
  S = st; task = p.t; hp = 0; chaos = p.t === "calm" ? 1 : 0;
  const add = (tag, cls, t) => { const e = mk(tag, cls); if (t) words(e, t); inn.append(e); return e; };
  const nx = mk("button", "nx"); nx.textContent = "Aage \u2726";
  nx.onclick = () => { const r = nx.getBoundingClientRect(); go(i + 1, r.left + r.width / 2, r.top + r.height / 2); };
  st.done = () => nx.classList.add("show");
  add("h2", "tt rv", p.title);
  if (p.tx) add("p", "tx rv", p.tx);

  if (p.t === "gate") {
    const r = add("div", "rv");
    r.innerHTML = '<button class="ringb" data-hold aria-label="Dabao aur pakde rakho"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="46"/><circle class="core" cx="50" cy="50" r="24"/><circle id="arc" cx="50" cy="50" r="46"/></svg></button>';
    add("p", "hint rv", p.hint);
  }
  if (p.t === "stars") {
    const area = add("div", "area rv"), cap = mk("p", "cap");
    area.innerHTML = '<svg class="lines" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>';
    const svg = area.firstChild; let lit = 0, prev = null;
    [[18, 26], [50, 72], [82, 30]].forEach(([x, y]) => {
      const b = mk("button", "stp"); b.style.left = x + "%"; b.style.top = y + "%"; b.setAttribute("aria-label", "Taara");
      b.onclick = e => {
        if (b.classList.contains("lit")) return;
        b.classList.add("lit"); burst(e.clientX, e.clientY, "#fff3c8", 28);
        if (prev) { const l = document.createElementNS("http://www.w3.org/2000/svg", "line"); l.setAttribute("x1", prev[0]); l.setAttribute("y1", prev[1]); l.setAttribute("x2", x); l.setAttribute("y2", y); svg.append(l); }
        prev = [x, y];
        if (++lit === 3) { cap.textContent = p.cap; cap.classList.add("f"); st.done(); }
      };
      area.append(b);
    });
    inn.append(cap);
  }
  if (p.t === "calm") {
    const b = add("button", "hb rv"); b.setAttribute("data-hold", ""); b.innerHTML = '<i class="fl"></i><span></span>';
    st.fl = b.firstChild; st.lab = b.lastChild; st.lab.textContent = p.btn; st.doneTxt = p.doneBtn;
  }
  if (p.t === "line") {
    const box = add("div", "area wv rv"), cap = mk("p", "cap");
    box.innerHTML = '<svg viewBox="0 0 300 100" preserveAspectRatio="none"><path d=""/></svg><input type="range" min="0" max="100" value="0" aria-label="Baat seedhi karo"><div class="lab"><span>ghuma hua</span><span>seedha</span></div>';
    box.style.height = "auto";
    st.path = box.querySelector("path"); st.sl = box.querySelector("input");
    st.sl.oninput = () => {
      if (+st.sl.value >= 97 && !st.fin) { st.fin = 1; st.sl.value = 100; st.sl.disabled = true; st.path.classList.add("gold"); cap.textContent = p.cap; cap.classList.add("f"); burst(W / 2, H * .55, "#ffd9a8", 50); st.done(); }
    };
    inn.append(cap);
  }
  if (p.t === "lanterns") {
    const row = add("div", "lrow rv"), list = mk("div", "plist"); let n = 0;
    p.items.forEach(it => {
      const b = mk("button", "lan"); b.setAttribute("aria-label", it.label); b.innerHTML = "<i></i>";
      b.onclick = e => {
        if (b.classList.contains("go")) return;
        b.classList.add("go"); burst(e.clientX, e.clientY, "#ffcf99", 24);
        const q = mk("p", "pr"); q.innerHTML = "<b></b><span></span>"; q.firstChild.textContent = it.label; q.lastChild.textContent = it.text; list.append(q);
        if (++n === p.items.length) st.done();
      };
      row.append(b);
    });
    inn.append(list);
  }
  if (p.t === "letter") {
    const card = add("div", "card rv"); card.innerHTML = '<p class="ghost"></p><p class="typed"></p>';
    card.firstChild.textContent = p.message; st.out = card.lastChild;
    const finish = () => { clearTimeout(st.tt); st.out.textContent = p.message; st.out.classList.add("end"); st.done(); };
    card.onclick = () => { if (!st.fin) { st.fin = 1; finish(); } };
    st.start = () => {
      let k = 0;
      const tick = () => {
        if (st.fin || cur !== i) return;
        st.out.textContent = p.message.slice(0, ++k);
        if (k >= p.message.length) { st.fin = 1; finish(); return; }
        st.tt = setTimeout(tick, /[.,\n]/.test(p.message[k - 1]) ? 280 : 30 + Math.random() * 30);
      };
      tick();
    };
  }
  if (p.t === "end") {
    const box = add("div", "choices rv"), r = add("p", "reply");
    box.innerHTML = '<button class="fill"></button><button></button>';
    const bs = box.querySelectorAll("button"); bs[0].textContent = p.yes; bs[1].textContent = p.wait;
    bs[0].onclick = e => { r.textContent = p.yesReply; document.body.classList.add("warm"); burst(e.clientX, e.clientY, "#ffcf99", 90); for (let k = 0; k < 4; k++) setTimeout(shootStar, k * 300); navigator.vibrate && navigator.vibrate(40); };
    bs[1].onclick = () => { r.textContent = p.waitReply; document.body.classList.remove("warm"); };
  } else if (p.t !== "gate") inn.append(nx);
  return el;
}

function begin(el, base) {
  el.querySelectorAll(".rv").forEach((e, k) => setTimeout(() => e.classList.add("show"), base + k * 520));
  const st = S; if (st.start) setTimeout(() => { if (cur === st.i) st.start(); }, base + 2400);
}

function go(i, x, y) {
  if (busy || i < 0 || i >= P.length) return;
  x = x == null ? W / 2 : x; y = y == null ? H / 2 : y;
  const old = stage.firstElementChild, el = build(i), type = TR[i];
  cur = i; busy = true; warp = 1; burst(x, y, "#d6d1ff", 50);
  $("sh").style.transform = `translateX(${P[i].off}px)`;
  document.documentElement.style.setProperty("--lit", P[i].lit);
  if (i < P.length - 1) document.body.classList.remove("warm");
  const fin = () => { old && old.remove(); busy = false; };
  stage.append(el);
  if (!old || RM) { fin(); begin(el, RM ? 0 : 300); return; }
  if (type === "circle") {
    const R = Math.hypot(W, H) * 1.05, d = 1100, c0 = `circle(0px at ${x}px ${y}px)`;
    el.style.clipPath = c0;
    const r = mk("div", "ring"); r.style.left = x + "px"; r.style.top = y + "px"; document.body.append(r);
    r.animate([{ width: "0px", height: "0px", opacity: 1 }, { width: 2 * R + "px", height: 2 * R + "px", opacity: .1 }], { duration: d, easing: "cubic-bezier(.65,0,.25,1)" }).onfinish = () => r.remove();
    el.animate([{ clipPath: c0 }, { clipPath: `circle(${R}px at ${x}px ${y}px)` }], { duration: d, easing: "cubic-bezier(.65,0,.25,1)", fill: "forwards" }).onfinish = () => { el.style.clipPath = ""; fin(); };
    begin(el, 700);
  } else if (type === "zoom") {
    old.animate([{ opacity: 1, transform: "scale(1)", filter: "blur(0px)" }, { opacity: 0, transform: "scale(1.25)", filter: "blur(14px)" }], { duration: 700, easing: "ease-in", fill: "forwards" });
    el.animate([{ opacity: 0, transform: "scale(.8)", filter: "blur(14px)" }, { opacity: 1, transform: "none", filter: "blur(0px)" }], { duration: 900, delay: 350, easing: "cubic-bezier(.2,.8,.2,1)", fill: "both" }).onfinish = fin;
    begin(el, 900);
  } else {
    const gl = mk("div", "glowline"); document.body.append(gl);
    gl.animate([{ transform: `translateY(${H}px)` }, { transform: "translateY(0px)" }], { duration: 1000, easing: "cubic-bezier(.65,0,.25,1)" }).onfinish = () => gl.remove();
    el.style.clipPath = "inset(100% 0 0 0)";
    el.animate([{ clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0 0 0 0)" }], { duration: 1000, easing: "cubic-bezier(.65,0,.25,1)", fill: "forwards" }).onfinish = () => { el.style.clipPath = ""; fin(); };
    begin(el, 700);
  }
}

// ---------- input: hold + tap ripples ----------
addEventListener("pointerdown", e => {
  if (e.target.closest && e.target.closest("[data-hold]")) hold = true;
  ripple(e.clientX, e.clientY);
});
["pointerup", "pointercancel"].forEach(n => addEventListener(n, () => { hold = false; }));
addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && (task === "gate" || task === "calm")) hold = true; });
addEventListener("keyup", () => { hold = false; });

// ---------- main loop ----------
function frame(t) {
  const dt = Math.min(t - last, 50); last = t;
  if (!document.hidden) {
    cx.clearRect(0, 0, W, H);
    cx.fillStyle = cx.strokeStyle = "#e8ebf8";
    stars.forEach(s => {
      const x = s.x * W - (px - W / 2) * s.z * .02, y = s.y * H - (py - H / 2) * s.z * .02;
      cx.globalAlpha = (.2 + .7 * Math.abs(Math.sin(t / 1500 + s.p))) * (.5 + s.z * .5);
      cx.beginPath(); cx.arc(x, y, s.r, 0, 6.3); cx.fill();
      if (warp > .03) { cx.lineWidth = s.r; cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + (x - W / 2) * warp * .35 * s.z, y + (y - H / 2) * warp * .35 * s.z); cx.stroke(); }
    });
    dust.forEach(d => {
      const j = .02 + chaos * .5;
      d.vx += rnd(-1, 1) * j + (px - d.x) * .000012 * dt - (d.y - H / 2) * .00004 * chaos;
      d.vy += rnd(-1, 1) * j + (py - d.y) * .000012 * dt + (d.x - W / 2) * .00004 * chaos;
      d.vx *= .96; d.vy *= .96;
      d.x = (d.x + d.vx * dt / 16 + W) % W; d.y = (d.y + d.vy * dt / 16 + H) % H;
      const al = .35 + .4 * Math.sin(t / 800 + d.p);
      cx.fillStyle = d.c; cx.globalAlpha = al * .15; cx.beginPath(); cx.arc(d.x, d.y, d.r * 4, 0, 6.3); cx.fill();
      cx.globalAlpha = al; cx.beginPath(); cx.arc(d.x, d.y, d.r, 0, 6.3); cx.fill();
    });
    shoots = shoots.filter(s => s.l > 0);
    shoots.forEach(s => {
      s.x += s.vx; s.y += s.vy; s.l -= .015;
      const g = cx.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9);
      g.addColorStop(0, "#fff"); g.addColorStop(1, "rgba(255,255,255,0)");
      cx.globalAlpha = Math.max(s.l, 0); cx.strokeStyle = g; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(s.x, s.y); cx.lineTo(s.x - s.vx * 9, s.y - s.vy * 9); cx.stroke();
    });
    bursts = bursts.filter(b => b.l > 0);
    bursts.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += .05; b.l -= .014; cx.globalAlpha = Math.max(b.l, 0); cx.fillStyle = b.c; cx.beginPath(); cx.arc(b.x, b.y, 2.2, 0, 6.3); cx.fill(); });
    cx.globalAlpha = 1;
    warp *= .94; if (warp < .01) warp = 0;

    if ((task === "gate" || task === "calm") && !busy && !S.fin) {
      hp = Math.max(0, Math.min(1, hp + (hold ? dt / (task === "gate" ? 1500 : 2400) : -dt / 1000)));
      if (task === "gate") {
        const a = $("arc"); if (a) a.style.strokeDashoffset = 289 * (1 - hp);
        if (hp >= 1) { S.fin = 1; hold = false; navigator.vibrate && navigator.vibrate(30); go(1, W / 2, H / 2); }
      } else {
        if (S.fl) S.fl.style.transform = `scaleX(${hp})`;
        chaos = 1 - hp;
        if (hp >= 1) { S.fin = 1; hold = false; chaos = 0; S.lab.textContent = S.doneTxt; burst(W / 2, H * .6, "#7fe3d0", 50); S.done(); }
      }
    }
    if (task === "line" && S.path) {
      const s = S.sl.value / 100, amp = (1 - s) * 34; let d = "M0 50";
      for (let x = 6; x <= 300; x += 6) d += `L${x} ${(50 + amp * Math.sin(x / 22 + t / 400) * Math.cos(x / 57)).toFixed(1)}`;
      S.path.setAttribute("d", d);
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
go(0);
</script>
</body>
</html>
